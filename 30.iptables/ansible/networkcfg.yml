---
- name: Configure all hosts
  hosts: all
  become: yes
  gather_facts: yes
  tasks:
    - name: Stop UFW service
      systemd:
        name: ufw
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: disable default route
      copy: 
        src: templates/99-installer-config.yaml 
        dest: /etc/netplan/99-installer-config.yaml
        remote_src: no
        owner: root
        group: root
        mode: 0644
      when: ansible_hostname not in ['inetRouter1', 'inetRouter2']

    - name: add default gateway for centralRouter
      copy: 
        src: templates/50-vagrant-{{ansible_hostname}}.yaml
        dest: /etc/netplan/50-vagrant.yaml
        remote_src: no
        owner: root
        group: root
        mode: 0644

    - name: Apply netplan configuration
      command: netplan apply
      become: yes

- name: Configure routers
  hosts: routers
  become: yes
  tasks:
    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    - name: Enable IP forwarding permanently
      lineinfile:
        path: /etc/sysctl.conf
        regexp: '^#?net.ipv4.ip_forward'
        line: 'net.ipv4.ip_forward=1'
        state: present

    - name: Add MASQUERADE rule for internet traffic
      iptables:
        table: nat
        chain: POSTROUTING
        destination: "!192.168.0.0/16"
        out_interface: enp0s3
        jump: MASQUERADE
        state: present
      when: ansible_hostname in ['inetRouter1', 'inetRouter2']

    - name: Persist iptables rules
      command: netfilter-persistent save
      when: ansible_hostname in ['inetRouter1', 'inetRouter2']


