---
all:
  children:
    routers:
      hosts:
        inetRouter1:
          ansible_host: 192.168.56.10
          ansible_ssh_private_key_file: .vagrant/machines/inetRouter1/virtualbox/private_key
        inetRouter2:
          ansible_host: 192.168.56.11
          ansible_ssh_private_key_file: .vagrant/machines/inetRouter2/virtualbox/private_key
        centralRouter:
          ansible_host: 192.168.56.12
          ansible_ssh_private_key_file: .vagrant/machines/centralRouter/virtualbox/private_key
    servers:
      hosts:
        centralServer:
          ansible_host: 192.168.56.13
          ansible_ssh_private_key_file: .vagrant/machines/centralServer/virtualbox/private_key
  vars:
    ansible_user: vagrant
    ansible_python_interpreter: /usr/bin/python3
    ansible_host_key_checking: False
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
