---
- name: Prepare Borg Backup
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install borgbackup
      apt:
        name: borgbackup
        state: present

- name: Configure backup server
  hosts: servers
  become: yes
  tasks:
    - name: Create borg user
      user:
        name: borg
        shell: /bin/bash
        create_home: yes
        system: yes
        password: "{{ 'borg' | password_hash('sha512') }}"
        update_password: on_create

    - name: Create ext4 on backup disk
      filesystem:
        fstype: ext4
        dev: "/dev/nvme0n1"
        force: true

    - name: Create mount point /var/backup
      file:
        path: /var/backup
        state: directory
        owner: borg
        group: borg
        mode: '0750'

    - name: Mount disk to /var/backup
      mount:
        path: /var/backup
        src: "/dev/nvme0n1"
        fstype: ext4
        state: mounted

    - name: Create .ssh directory for borg user
      file:
        path: /home/borg/.ssh
        state: directory
        owner: borg
        group: borg
        mode: '0700'

    - name: Create authorized_keys file
      file:
        path: /home/borg/.ssh/authorized_keys
        state: touch
        owner: borg
        group: borg
        mode: '0600'

    - name: Set ownership on /var/backup
      file:
        path: /var/backup
        owner: borg
        group: borg
        mode: '0750'
