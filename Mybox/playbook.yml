---
- name: Update and clean Ubuntu system
  hosts: all
  become: yes
  gather_facts: yes

  vars:
    mybox_archives:
      - { src: "/opt/loki.zip", dir: "/tmp/loki-extract", pattern: "loki", bin: "loki", path_search: "/loki(-linux-amd64)?$" }
      - { src: "/opt/node_exporter.tar.gz", dir: "/tmp/node-exporter-extract", pattern: "node_exporter", bin: "node_exporter", path_search: "/node_exporter$" }
      - { src: "/opt/prometheus.tar.gz", dir: "/tmp/prometheus-extract", pattern: "prometheus", bin: "prometheus", path_search: "/prometheus$" }
      - { src: "/opt/alertmanager.tar.gz", dir: "/tmp/alertmanager-extract", pattern: "alertmanager", bin: "alertmanager", path_search: "/alertmanager$" }
      - { src: "/opt/alloy.zip", dir: "/tmp/alloy-extract", pattern: "alloy", bin: "alloy", path_search: "/alloy(-linux-amd64)?$" }
      - { src: "/opt/rest-server.tar.gz", dir: "/tmp/rest-server-extract", pattern: "rest-server", bin: "rest-server", path_search: "/rest-server$" }
    mybox_binaries:
      - loki
      - node_exporter
      - prometheus
      - alertmanager
      - alloy
      - rest-server
    mybox_services_disabled:
      - nginx
      - mysql
      - ufw
      - php8.1-fpm
      - grafana-server
      - haproxy
      - nfs-server
    mybox_services_running:
      - ssh

  tasks:
###Обновление и установка софта
    - name: Update apt cache and upgrade all packages
      apt:
        update_cache: yes
        upgrade: dist
        force_apt_get: yes
        autoremove: yes
        autoclean: yes

    - name: Install base dependencies
      apt:
        name:
          - nginx
          - mysql-server
          - php8.1-fpm
          - php8.1-mysql
          - php8.1-curl
          - php8.1-xml
          - php8.1-gd
          - php8.1-mbstring
          - php8.1-zip
          - ufw
          - restic
          - curl
          - wget
          - unzip
          - tar
          - openssl
          - apache2-utils
          - python3-pymysql
          - python3-passlib
          - gnupg2
          - apt-transport-https
          - nfs-common
          - nfs-kernel-server
          - haproxy
        state: present
        update_cache: yes

    - name: Stop and disable selected APT services after install
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop: "{{ mybox_services_disabled | reject('equalto', 'grafana-server') | list }}"

    - name: Stop and disable NFS client target if present (nfs-common)
      systemd:
        name: nfs-client.target
        state: stopped
        enabled: no
      ignore_errors: yes

###Скачивание архивов
    - name: Скачать Loki
      get_url:
        url: "https://github.com/grafana/loki/releases/download/v3.2.0/loki-linux-amd64.zip"
        dest: "/opt/loki.zip"
        mode: '0644'

    - name: Скачать Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz"
        dest: "/opt/node_exporter.tar.gz"
        mode: '0644'

    - name: Скачать Prometheus
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v2.54.0/prometheus-2.54.0.linux-amd64.tar.gz"
        dest: "/opt/prometheus.tar.gz"
        mode: '0644'

    - name: Скачать Alertmanager
      get_url:
        url: "https://github.com/prometheus/alertmanager/releases/download/v0.27.0/alertmanager-0.27.0.linux-amd64.tar.gz"
        dest: "/opt/alertmanager.tar.gz"
        mode: '0644'

    - name: Скачать Rest Server
      get_url:
        url: "https://github.com/restic/rest-server/releases/download/v0.13.0/rest-server_0.13.0_linux_amd64.tar.gz"
        dest: "/opt/rest-server.tar.gz"
        mode: '0644'

    - name: Скачать Alloy
      get_url:
        url: "https://github.com/grafana/alloy/releases/download/v1.16.1/alloy-linux-amd64.zip"
        dest: "/opt/alloy.zip"
        mode: '0644'

    - name: Скачивание WordPress
      get_url:
        url: "https://ru.wordpress.org/latest-ru_RU.tar.gz"
        dest: "/opt/wordpress_latest-ru_RU.tar.gz"
        mode: '0644'

###Установка бинарников из архивов
    - name: Create extract directories for archives
      file:
        path: "{{ item.dir }}"
        state: directory
        mode: '0755'
      loop: "{{ mybox_archives }}"

    - name: Unarchive binary distributions
      ansible.builtin.unarchive:
        src: "{{ item.src }}"
        dest: "{{ item.dir }}"
        remote_src: true
      loop: "{{ mybox_archives }}"

    - name: Find binaries in archives
      ansible.builtin.find:
        paths: "{{ item.dir }}"
        patterns: "{{ item.pattern }}*"
        file_type: file
        recurse: true
      loop: "{{ mybox_archives }}"
      register: mybox_binary_find

    - name: Install binaries to /usr/local/bin
      ansible.builtin.copy:
        src: >-
          {{ item.files
             | selectattr('path', 'search', mybox_archives[idx].path_search)
             | map(attribute='path')
             | list
             | first }}
        dest: "/usr/local/bin/{{ mybox_archives[idx].bin }}"
        mode: '0755'
        remote_src: true
      loop: "{{ mybox_binary_find.results }}"
      loop_control:
        index_var: idx
      when: item.matched | default(0) > 0

###Установка grafana
    - name: Добавить GPG-ключ Grafana
      apt_key:
        url: "https://apt.grafana.com/gpg.key"
        state: present
      ignore_errors: yes

    - name: Добавить репозиторий Grafana
      apt_repository:
        repo: "deb https://apt.grafana.com stable main"
        state: present
        filename: grafana
        update_cache: yes
      ignore_errors: yes

    - name: Grafana
      apt:
        name: grafana
        state: present
        update_cache: yes

    - name: Stop and disable Grafana server
      systemd:
        name: grafana-server
        state: stopped
        enabled: no

###Найстройка для vagrant
    - name: Ensure vagrant user exists
      user:
        name: vagrant
        state: present
        shell: /bin/bash

    - name: Create .ssh directory for vagrant user
      file:
        path: /home/vagrant/.ssh
        state: directory
        mode: '0700'
        owner: vagrant
        group: vagrant

    - name: Install Vagrant insecure public key from local file
      copy:
        src: files/vagrant.pub
        dest: /home/vagrant/.ssh/authorized_keys
        mode: '0600'
        owner: vagrant
        group: vagrant

    - name: Set correct permissions for .ssh directory
      file:
        path: /home/vagrant/.ssh
        state: directory
        mode: '0700'
        owner: vagrant
        group: vagrant

    - name: Set correct permissions for authorized_keys
      file:
        path: /home/vagrant/.ssh/authorized_keys
        state: file
        mode: '0600'
        owner: vagrant
        group: vagrant

    - name: Configure passwordless sudo for vagrant
      copy:
        content: "vagrant ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/vagrant
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Set password for vagrant user to 'vagrant'
      user:
        name: vagrant
        password: "{{ 'vagrant' | password_hash('sha512') }}"
        update_password: always

###Очистка системы
    - name: Disable cloud-init permanently
      file:
        path: /etc/cloud/cloud-init.disabled
        state: touch

    - name: Clean cloud-init state data
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/cloud/instances
        - /var/lib/cloud/instance
        - /var/lib/cloud/data
      ignore_errors: yes

    - name: Clean apt cache (apt-get clean)
      apt:
        autoclean: yes
        clean: yes

    - name: Clear journal logs (optional, to reduce box size)
      command: journalctl --vacuum-size=1M
      changed_when: false

    - name: Clear temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/*
        - /var/tmp/*

    - name: Zero free disk space to shrink VM disk image
      ansible.builtin.shell: dd if=/dev/zero of=/EMPTY bs=1M status=none 2>/dev/null || true
      changed_when: true
      async: 3600
      poll: 15

    - name: Remove zero-fill staging file
      ansible.builtin.file:
        path: /EMPTY
        state: absent

###Отчёт о состоянии сервисов
    - name: Gather service facts for report
      ansible.builtin.service_facts:

    - name: Verify disabled services are stopped and disabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item ~ '.service'] is defined
          - ansible_facts.services[item ~ '.service'].state in ['stopped', 'inactive']
          - ansible_facts.services[item ~ '.service'].status == 'disabled'
        fail_msg: "Сервис {{ item }} должен быть inactive/stopped и disabled"
      loop: "{{ mybox_services_disabled }}"

    - name: Verify SSH service is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['ssh.service'] is defined
          - ansible_facts.services['ssh.service'].state == 'running'
        fail_msg: "Сервис ssh должен быть active/running"

    - name: Check archive binaries are installed
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      loop: "{{ mybox_binaries }}"
      register: mybox_binary_stats

    - name: Verify all archive binaries exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.executable
        fail_msg: "Бинарник {{ mybox_binaries[ansible_loop.index0] }} отсутствует в /usr/local/bin"
      loop: "{{ mybox_binary_stats.results }}"
      loop_control:
        extended: true

    - name: Build lists for services report
      ansible.builtin.set_fact:
        mybox_report_disabled: "{{ mybox_services_disabled }}"
        mybox_report_running: "{{ mybox_services_running }}"
        mybox_report_binaries: "{{ mybox_binaries }}"

    - name: Mybox services status report
      ansible.builtin.debug:
        msg: |
          === Mybox: состояние сервисов ===
          Отключены (stopped/disabled):
          {% for s in mybox_report_disabled %}
            - {{ s }}
          {% endfor %}

          Работают (active):
          {% for s in mybox_report_running %}
            - {{ s }}
          {% endfor %}

          Бинарники в /usr/local/bin (без systemd):
            - {{ mybox_report_binaries | join(', ') }}
