---
- name: Установка Node Exporter на все узлы
  hosts: all
  become: yes

  tasks:
    - name: Создание пользователя node_exporter
      user:
        name: node_exporter
        system: yes
        shell: /usr/sbin/nologin
        create_home: no

    - name: Создать директорию textfile collector
      file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: node_exporter
        group: node_exporter
        mode: '0755'

    - name: Проверка наличия бинарника Node Exporter
      ansible.builtin.stat:
        path: /usr/local/bin/node_exporter
      register: node_exporter_stat

    - name: Проверка бинарника Node Exporter в box-образе
      ansible.builtin.assert:
        that:
          - node_exporter_stat.stat.exists
          - node_exporter_stat.stat.executable
        fail_msg: "Бинарник /usr/local/bin/node_exporter должен быть предустановлен в образе diplom-ubuntu"

    - name: Развернуть systemd-юнит Node Exporter
      template:
        src: templates/node_exporter/node_exporter.service.j2
        dest: /etc/systemd/system/node_exporter.service
        owner: root
        group: root
        mode: '0644'
      notify: Reload systemd

    - name: Активация и запуск Node Exporter
      systemd:
        name: node_exporter.service
        state: started
        enabled: yes
        daemon_reload: yes

  handlers:
    - name: Reload systemd
      systemd: { daemon_reload: yes }

- name: Настройка Monitoring (Prometheus + Grafana + Alertmanager)
  hosts: monitoring
  become: yes

  tasks:

    - name: Создание пользователей для сервисов
      user:
        name: "{{ item }}"
        system: yes
        shell: /usr/sbin/nologin
        create_home: no
      loop: [prometheus, alertmanager]

    - name: Проверка наличия бинарника Prometheus
      ansible.builtin.stat:
        path: /usr/local/bin/prometheus
      register: prometheus_stat

    - name: Проверка наличия бинарника promtool
      ansible.builtin.stat:
        path: /usr/local/bin/promtool
      register: promtool_stat

    - name: Проверка бинарников Prometheus в box-образе
      ansible.builtin.assert:
        that:
          - prometheus_stat.stat.exists
          - prometheus_stat.stat.executable
          - promtool_stat.stat.exists
          - promtool_stat.stat.executable
        fail_msg: "Бинарники /usr/local/bin/prometheus и promtool должны быть предустановлены в образе diplom-ubuntu"

    - name: Создать директории Prometheus
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop: [/etc/prometheus, /var/lib/prometheus]

    - name: Проверка наличия бинарника Alertmanager
      ansible.builtin.stat:
        path: /usr/local/bin/alertmanager
      register: alertmanager_stat

    - name: Проверка бинарника Alertmanager в box-образе
      ansible.builtin.assert:
        that:
          - alertmanager_stat.stat.exists
          - alertmanager_stat.stat.executable
        fail_msg: "Бинарник /usr/local/bin/alertmanager должен быть предустановлен в образе diplom-ubuntu"

    - name: Создать директории Alertmanager
      file:
        path: "{{ item }}"
        state: directory
        owner: alertmanager
        group: alertmanager
        mode: '0755'
      loop: [/etc/alertmanager, /var/lib/alertmanager]

    - name: Развернуть prometheus.yml
      template:
        src: templates/prometheus/prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
      notify: Restart Prometheus

    - name: Развернуть alert_rules.yml
      template:
        src: templates/prometheus/alert_rules.yml.j2
        dest: /etc/prometheus/alert_rules.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
      notify: Restart Prometheus

    - name: Развернуть alertmanager.yml
      template:
        src: templates/alertmanager/alertmanager.yml.j2
        dest: /etc/alertmanager/alertmanager.yml
        owner: alertmanager
        group: alertmanager
        mode: '0644'
      notify: Restart Alertmanager

    - name: Развернуть grafana.ini
      template:
        src: templates/grafana/grafana.ini.j2
        dest: /etc/grafana/grafana.ini
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: Создать директории provisioning Grafana
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: grafana
        mode: '0755'
      loop: [/etc/grafana/provisioning/datasources, /etc/grafana/provisioning/dashboards]

    - name: Создать директорию Grafana dashboards
      file:
        path: /var/lib/grafana/dashboards
        state: directory
        owner: grafana
        group: grafana
        mode: '0755'

    - name: Развернуть datasource Prometheus+Loki для Grafana
      template:
        src: templates/grafana/grafana-datasources.yml.j2
        dest: /etc/grafana/provisioning/datasources/datasources.yml
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: Развернуть provider dashboards для Grafana
      template:
        src: templates/grafana/grafana-dashboards.yml.j2
        dest: /etc/grafana/provisioning/dashboards/dashboards.yml
        owner: root
        group: grafana
        mode: '0640'
      notify: Restart Grafana

    - name: Развернуть dashboard инфраструктуры
      template:
        src: templates/grafana/node-overview-dashboard.json.j2
        dest: /var/lib/grafana/dashboards/node-overview-dashboard.json
        owner: grafana
        group: grafana
        mode: '0644'
      notify: Restart Grafana

    - name: Развернуть systemd-юниты сервисов
      template:
        src: "templates/{{ item }}/{{ item }}.service.j2"
        dest: "/etc/systemd/system/{{ item }}.service"
        owner: root
        group: root
        mode: '0644'
      loop: [prometheus, alertmanager]
      notify: Reload systemd

    - name: Активация и запуск сервисов мониторинга
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
        daemon_reload: yes
      loop:
        - prometheus.service
        - alertmanager.service
        - grafana-server.service

  handlers:
    - name: Restart Prometheus
      systemd: { name: prometheus.service, state: restarted, daemon_reload: yes }
    - name: Restart Alertmanager
      systemd: { name: alertmanager.service, state: restarted, daemon_reload: yes }
    - name: Restart Grafana
      systemd: { name: grafana-server.service, state: restarted, daemon_reload: yes }
    - name: Reload systemd
      systemd: { daemon_reload: yes }
