[frontend]
192.168.56.10

[backend:children]
backend_master
backend_slave

[backend_master]
192.168.56.20

[backend_slave]
192.168.56.21

[monitoring]
192.168.56.30

[logging]
192.168.56.40

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_user=vagrant
service_net=10.10.10.0/24
management_net=192.168.56.0/24
vagrant_nat_host_ip=10.0.2.2
timezone="Europe/Moscow"
domain_name=lab.example.com
wp_public_port=8443
frontend_service_ip=10.10.10.10
monitoring_service_ip=10.10.10.30
logging_service_ip=10.10.10.40
restic_password=ResticSecurePass!
restic_server_user=restic
restic_server_password=ResticServerPass!
restic_repo_url_base=rest:http://{{ restic_server_user }}:{{ restic_server_password }}@{{ monitoring_service_ip }}:8000
node_exporter_ver=1.8.2
promtail_version=3.0.0
box_artifacts_dir=/opt
# UFW.yml — объединение базовых и групповых правил
ufw_final_rules={{ base_ufw_rules + (extra_ufw_rules | default([])) }}

# Базовые правила для всех: SSH из management-сети/Vagrant NAT, node_exporter только для Prometheus.
base_ufw_rules=[{"rule": "allow", "port": "22", "proto": "tcp", "from": "{{ management_net }}"}, {"rule": "allow", "port": "22", "proto": "tcp", "from": "{{ vagrant_nat_host_ip }}"}, {"rule": "allow", "port": "9100", "proto": "tcp", "from": "{{ monitoring_service_ip }}"}]

# =============================================================================
# frontend (front.yml)
# =============================================================================
[frontend:vars]
restic_label=frontend
backend_ips=["10.10.10.20", "10.10.10.21"]
restic_repo_path={{ restic_repo_url_base }}/frontend
extra_ufw_rules=[{"rule": "allow", "port": "80", "proto": "tcp", "from": "any"}, {"rule": "allow", "port": "443", "proto": "tcp", "from": "any"}]

# =============================================================================
# backend (back.yml)
# =============================================================================
[backend:vars]
db_root_password=MySQLRootSecure!
db_wp_name=wordpress_db
db_wp_user=wp_user
db_wp_password=WpUserSecure!
wp_dir=/var/www/wordpress
wp_demo_restore_enabled=true
wp_demo_sql_src=templates/wordpress/demo/forum-demo.sql
wp_demo_content_src=templates/wordpress/demo/forum-wp-content.tar.gz
wp_demo_content_marker={{ wp_dir }}/.wp-demo-content-restored
master_ip=10.10.10.20
slave_ip=10.10.10.21
repl_user=repl_user
repl_password=ReplSecure!
wp_content_sync_marker={{ wp_dir }}/.wp-content-synced-from-master
restic_repo_path={{ restic_repo_url_base }}/backend_{{ db_role }}

[backend_master:vars]
db_role=master
restic_label=backend_master
# Репликация и HTTP от frontend — сервисная сеть 10.10.10.0/24
extra_ufw_rules=[{"rule": "allow", "port": "3306", "proto": "tcp", "from": "10.10.10.21"}, {"rule": "allow", "port": "80", "proto": "tcp", "from": "10.10.10.10"}]

[backend_slave:vars]
db_role=slave
restic_label=backend_slave
extra_ufw_rules=[{"rule": "allow", "port": "3306", "proto": "tcp", "from": "10.10.10.20"}, {"rule": "allow", "port": "80", "proto": "tcp", "from": "10.10.10.10"}]

# =============================================================================
# monitoring (monitoring.yml)
# =============================================================================
[monitoring:vars]
grafana_admin_password=GrafanaSecure!
restic_repos=["frontend", "backend_master", "backend_slave"]
alertmanager_smtp_server=smtp.example.com:587
alertmanager_smtp_user=alerts@example.com
alertmanager_smtp_password=SmtpPass!
alertmanager_email_to=admin@example.com
prometheus_ver=2.54.0
alertmanager_ver=0.27.0
rest_server_ver=0.13.0
extra_ufw_rules=[{"rule": "allow", "port": "9100", "proto": "tcp", "from": "{{ service_net }}"}, {"rule": "allow", "port": "9090", "proto": "tcp", "from": "{{ service_net }}"}, {"rule": "allow", "port": "3000", "proto": "tcp", "from": "{{ service_net }}"}, {"rule": "allow", "port": "3000", "proto": "tcp", "from": "{{ vagrant_nat_host_ip }}"}, {"rule": "allow", "port": "9093", "proto": "tcp", "from": "{{ service_net }}"}, {"rule": "allow", "port": "8000", "proto": "tcp", "from": "{{ service_net }}"}]

# =============================================================================
# logging (logging.yml)
# =============================================================================
[logging:vars]
loki_port=3100
loki_retention=168h
loki_version=3.0.0
extra_ufw_rules=[{"rule": "allow", "port": "3100", "proto": "tcp", "from": "{{ service_net }}"}, {"rule": "allow", "port": "9100", "proto": "tcp", "from": "{{ service_net }}"}]
